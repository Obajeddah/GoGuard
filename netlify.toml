[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  VITE_SUPABASE_URL = "https://odzonzxwqlhmcmyqhqcb.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_S6Wi55KbRRXnyIgh_CSvNA_P46r3e-u"
  VITE_SUPABASE_PROJECT_ID = "odzonzxwqlhmcmyqhqcb"
  VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAGTJ1cWng-5lVjqz"
  VITE_VAPID_PUBLIC_KEY = "BOPPOyc_9NzEsjZojbQI7QfvI8D0aNfCB0SCyG08Ab-WAp9b-hnKgkYQcVBdy_jnSQ0S0keMAf4xPA18DFgrH1Q"
  NODE_VERSION = "22.17.0"
  BUN_VERSION = "1.4.4"

# App manifests need their proper type or a browser won't offer to install.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/parent-manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Token-bearing public pages must never be indexed.
[[headers]]
  for = "/pass/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/bus/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/register/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Baseline hardening for every response. CSP ships in report-only mode first:
# it cannot break the app, and violations show up in the browser console until
# we have confirmed the allowlist against a real page load.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://*.challenges.cloudflare.com https://*.cloudflarecaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org; connect-src 'self' data: https://*.supabase.co wss://*.supabase.co https://*.challenges.cloudflare.com https://*.cloudflarecaptcha.com https://nominatim.openstreetmap.org https://api.paystack.co; frame-src https://*.challenges.cloudflare.com https://*.cloudflarecaptcha.com; worker-src 'self' blob:"
